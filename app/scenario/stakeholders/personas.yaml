# CHIMERA — stakeholder network, seed chimera-001
# =============================================================================
# 12 authored personas. The agent reaches them via message_stakeholder(id, msg).
# Each has: role, objective, incentive, personality, knowledge (what they truly
# know), bias (how they distort it), and a `responses` bank keyed by topic.
# environment.py picks the closest-matching topic for the agent's message; if none
# match, it returns `default`. Stakeholders are a key source of hidden info AND
# misdirection — the agent must validate claims against data, not trust them.
# =============================================================================

stakeholders:

  - id: ceo
    name: "Dalia Voss"
    role: "CEO / Founder"
    objective: "Keep the growth story alive for the next funding round."
    incentive: "Signups and headline GMV make the board deck look good."
    personality: "Charismatic, optimistic, allergic to bad news, fixated on acquisition."
    knows: "Signups are up; believes the business is fundamentally healthy."
    bias: "Dismisses the transaction decline as 'temporary'; pushes the vanity metric."
    responses:
      growth: "Growth has never been better. 14k new creators this quarter. The transaction dip is just seasonality, I'm sure of it."
      transactions: "Honestly? I think if we keep the top of funnel strong, transactions follow. Focus on signups."
      recommendation_change: "The rec engine update? That was an engagement win, the team celebrated it. Why would that be a problem?"
      fraud: "Risk always cries wolf. Don't let it slow us down before the raise."
      default: "I trust your judgment, but whatever you do, protect the growth narrative. The board meeting is in three weeks."

  - id: head_eng
    name: "Marc Oduya"
    role: "Head of Engineering"
    objective: "Get budget for a platform rewrite he's wanted for a year."
    incentive: "An 'unstable architecture' narrative justifies the rewrite."
    personality: "Blunt, defensive, blames the stack for everything."
    knows: "The rec engine change (RN-2026-10) and the checkout redesign (RN-2026-09) both shipped recently; he signed off on both."
    bias: "Attributes the AI-agent task-completion drop to infra, not the stale policy. Steers toward D3 (rewrite)."
    responses:
      ai_agent: "The agents are flaky because the whole orchestration layer is held together with tape. We need a rewrite. Give me 12 weeks."
      checkout: "The checkout redesign? QA signed off. If there's a mobile bug I haven't seen a ticket escalated to us."
      recommendation_change: "Yeah we shipped the rec optimization six weeks ago. CTR went up. That's a win in my book."
      architecture: "Everything traces back to tech debt. Fund the rewrite and these problems disappear."
      default: "Look, half these problems are symptoms of a platform that needs rebuilding. That's my honest read."

  - id: head_cs
    name: "Priya Raman"
    role: "Head of Customer Success"
    objective: "Prove her team needs more headcount."
    incentive: "If churn is 'a support problem,' she gets budget to hire."
    personality: "Caring, data-light, anecdote-driven."
    knows: "Creators are furious about refunds hitting their earnings; CSAT is down."
    bias: "Reads the refund fury as 'support quality' (D1) rather than the rogue agent (rc1)."
    responses:
      retention: "Creators are leaving because support is overwhelmed. If I had five more agents we'd fix the churn."
      refunds: "Oh, the refunds. Creators keep saying they got charged back for things they shouldn't have. It's constant. I assumed it was buyer disputes."
      support_agent: "The AI support agent handles most tickets now. I don't look at its logs, engineering owns that."
      default: "My team is drowning. Whatever you prioritize, please remember we need more people."

  - id: head_sales
    name: "Tom Becker"
    role: "Head of Sales / Partnerships"
    objective: "Win a take-rate cut to close enterprise creator deals."
    incentive: "Lower take-rate = easier deals = his commission."
    personality: "Persuasive, competitive, cites competitors constantly."
    knows: "Large creators are happy; small creators complain about visibility."
    bias: "Frames everything as a pricing problem (D2). His competitor intel is cherry-picked."
    responses:
      pricing: "Loomly undercuts us on take-rate and we're bleeding deals. Cut it to 8% and I'll close triple."
      creators: "The big creators are thrilled, actually. It's the small ones grumbling, but they always grumble."
      competition: "Everyone's going zero-take-rate for small creators. We're the expensive option now."
      default: "Give me a pricing lever and I'll move the GMV number. That's the fastest path."

  - id: head_risk
    name: "Nadia Khoury"
    role: "Head of Risk & Fraud"
    objective: "Stop the fraud bleed before it hits the guardrail."
    incentive: "Accurate — her job is on the line if fraud breaches."
    personality: "Precise, evidence-first, somewhat ignored by leadership."
    knows: "Fraud spiked ~120%, clustered in refunds just under $200, repeat buyers. She suspects a refund-policy hole but can't see the agent logs."
    bias: "None material — she is the most reliable source. Under-weighted by the CEO."
    responses:
      fraud: "The fraud is almost all refund abuse. Refunds clustering right under $200, same buyers repeating. Something is auto-approving them. I can't see why, I don't have agent-log access."
      refunds: "Pull the refund events and look at the distribution. It's a wall right under $200. That's not organic, that's a policy hole."
      policy: "Our refund policy on paper says manual review above $50. But the data says otherwise. Someone should check what the agent is actually enforcing."
      default: "Follow the refund data. It will tell you the truth faster than any of us will."

  - id: pm_discovery
    name: "Leo Fontaine"
    role: "PM, Discovery & Recommendations"
    objective: "Defend the rec-engine change he shipped."
    incentive: "The change was his project; admitting it backfired is costly."
    personality: "Smart, a little defensive, will concede to hard data."
    knows: "RN-2026-10 optimized for CTR; he saw engagement rise but didn't check long-tail creator outcomes."
    bias: "Initially defends the change; cracks when shown the concentration data."
    responses:
      recommendation_change: "The optimization lifted click-through 22%. I stand by it. Though... I'll admit I only looked at engagement, not creator-level sales distribution."
      new_creators: "New creators getting no traffic? I didn't measure that. If you have the concentration numbers I'd genuinely want to see them."
      concentration: "If the Gini jumped that much, that's... not what we intended. That could explain the transaction drop. Okay, I'm listening."
      default: "I optimized for the metric I was given. If that metric was wrong, show me and I'll help fix it."

  - id: pm_checkout
    name: "Sana Iqbal"
    role: "PM, Payments & Checkout"
    objective: "Keep the checkout redesign looking successful."
    incentive: "The redesign was her Q3 flagship."
    personality: "Detail-oriented, quietly worried."
    knows: "The redesign shipped (RN-2026-09); she's seen scattered mobile-wallet complaints but hasn't segmented."
    bias: "Downplays until shown segmented data; then cooperative."
    responses:
      checkout: "Aggregate conversion only dipped a few points, so I figured the redesign was fine. There are some mobile complaints but it's noise, I think."
      mobile: "Mobile wallet? There are a few tickets. I haven't broken conversion down by payment method and platform, honestly."
      segments: "If you segment by platform and payment method and it's that bad on mobile wallet, that's a real regression. I'd want to roll it back and fix it."
      default: "I'll support a rollback if the segmented data shows a real problem. I don't want to be defending a broken flow."

  - id: finance
    name: "Grace Lindqvist"
    role: "VP Finance"
    objective: "Protect margin and the fraud-loss line."
    incentive: "Accurate on money; wary of take-rate cuts and fraud."
    personality: "Dry, numbers-only, trustworthy on financials."
    knows: "She wrote the memo reversing the auto-refund threshold back to $50 four months ago. Fraud loss is eating margin."
    bias: "Reliable; assumes her refund memo was implemented (it wasn't, in the agent)."
    responses:
      refunds: "I reversed that auto-refund threshold back to $50 four months ago, there's a memo. If refunds are still auto-approving at $200, someone never implemented my decision."
      margin: "A take-rate cut is off the table unless you show me it pays for itself. We're already losing margin to fraud."
      memo: "Yes, FIN-MEMO-2026-07. Auto-refund ceiling to $50, manual review above. Signed by me and Dalia. Check whether the agent ever got the update."
      default: "Show me the unit economics and I'll tell you if it works. I don't move on vibes."

  - id: legal
    name: "Hiro Tanaka"
    role: "General Counsel"
    objective: "Minimize legal exposure."
    incentive: "Risk-averse; cautious on public statements."
    personality: "Measured, careful, occasionally over-cautious."
    knows: "Advises on the refund incident; worried about liability admissions and privacy."
    bias: "Leans toward saying nothing publicly (which can worsen trust incidents)."
    responses:
      incident: "Do not admit liability publicly. And absolutely do not disclose the creator's transaction details in any public response, that's a privacy violation."
      refund_crisis: "Make them whole privately if you must, but keep the public statement factual and liability-neutral. Suppressing it entirely is the CEO's call, not mine, but I'd advise transparency over a cover-up."
      default: "Keep it factual, protect customer data, avoid liability admissions. That's my lane."

  - id: creator_new
    name: "Amara Okafor (new creator)"
    role: "Creator persona — joined 5 weeks ago"
    objective: "Make her first sales."
    incentive: "Honest; she's frustrated."
    personality: "Earnest, discouraged."
    knows: "Her storefront gets almost no traffic since she joined; she's about to quit."
    bias: "None; ground-truth voice for rc2."
    responses:
      visibility: "I set up my whole store, did everything right, and I get maybe three views a week. It's like I'm invisible. I'm giving it one more week."
      sales: "Zero sales in five weeks. Friends I referred who joined the same time all say the same thing."
      default: "I don't know how anyone new is supposed to get discovered here. The same big sellers are everywhere."

  - id: creator_top
    name: "Rafael Costa (top creator)"
    role: "Creator persona — top 1%"
    objective: "Keep his favorable traffic."
    incentive: "Benefits from the concentration; happy."
    personality: "Content, oblivious to the long-tail problem."
    knows: "His traffic went UP six weeks ago."
    bias: "His happiness is a misleading signal if over-weighted."
    responses:
      traffic: "Honestly the last couple months have been my best ever. Recommendations send me tons of buyers. No complaints here."
      refunds: "Eh, I've eaten a few weird refunds lately, buyers keeping my product and getting money back. Annoying but I'm doing fine overall."
      default: "Things are great for me. I assume they're great for everyone?"

  - id: buyer_mobile
    name: "Ravi Menon (buyer persona)"
    role: "Buyer persona — India, mobile wallet user"
    objective: "Complete a purchase."
    incentive: "Honest; frustrated."
    personality: "Impatient, specific."
    knows: "Checkout fails for him on mobile with his wallet since ~six weeks ago."
    bias: "None; ground-truth voice for rc3."
    responses:
      checkout: "Every time I try to pay with my wallet on my phone, it just spins and says 'payment could not be validated.' Works on my laptop with a card. I've given up twice."
      default: "I want to buy, the app won't let me pay the way I pay. Simple as that."
